# .github/workflows/ci.yml
name: React CI Pipeline

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Run unit tests
        run: npm run test -- --run # The --run flag is essential for CI

      - name: Build application
        run: npm run build
